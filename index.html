<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>4399游戏盒 · 关注名单</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f5f7;color:#1a1d21;
 font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 12px 48px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:-.2px}
.sub{color:#8a8f98;font-size:12px;margin-bottom:12px}
.sub b{color:#4b5563;font-weight:600}
.stats{display:flex;gap:8px;margin-bottom:12px}
.st{flex:1;background:#fff;border-radius:10px;padding:9px 4px;text-align:center;
 border:1px solid #eef0f2;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.st .n{font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.st .l{font-size:10.5px;color:#9aa0a8;margin-top:1px}
.st.todo .n{color:#c2410c}
.st.granted .n{color:#047857}
.st.rejected .n{color:#b91c1c}
.bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bar button{flex:0 0 auto;padding:6px 12px;border:1px solid #e2e5e9;background:#fff;
 border-radius:999px;font-size:12.5px;color:#5a6169;cursor:pointer;transition:.15s}
.bar button.on{background:#1a1d21;color:#fff;border-color:#1a1d21}
.ghost{padding:6px 11px;border:1px solid #e2e5e9;background:#fff;border-radius:8px;
 font-size:12px;color:#6b7280;cursor:pointer}
.card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;
 box-shadow:0 1px 2px rgba(16,24,40,.05);border:1px solid #eef0f2;
 border-left:3px solid transparent;transition:.15s}
.card.granted{border-left-color:#10b981;background:#f9fdfb}
.card.rejected{border-left-color:#ef4444;background:#fdfafa}
.card.rejected .gname,.card.rejected .dl{opacity:.5}
.card.off{background:#fbfbfc;border-style:dashed}
.top{display:flex;gap:11px;align-items:center}
.icon{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#f0f1f3;flex:0 0 46px}
.icon.ph{display:flex;align-items:center;justify-content:center;color:#c2c6cc;font-size:17px}
.mid{flex:1;min-width:0}
.gname{font-size:15px;font-weight:600;margin:0 0 5px;line-height:1.3;word-break:break-all}
.gname a{color:inherit;text-decoration:none}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
 padding:2.5px 9px;border-radius:999px;white-space:nowrap}
.status.on{background:#fff1e6;color:#c2410c;border:1px solid #fed7aa}
.status.off{background:#f4f5f7;color:#9aa0a8;border:1px solid #e8eaed}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
.right{text-align:right;flex:0 0 auto}
.dl{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.1;font-variant-numeric:tabular-nums}
.dl small{font-size:11px;font-weight:500;color:#9aa0a8;margin-left:2px;letter-spacing:0}
.dlz{font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:#dc2626}.down{color:#059669}.flat{color:#b9bec5}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px dashed #f0f2f4}
.bd{font-size:11px;padding:1.5px 6px;border-radius:5px;background:#f4f5f7;color:#6b7280;white-space:nowrap}
.spark{margin-top:9px}
.spark svg{display:block;width:100%;height:30px;overflow:visible}
.warn{margin-top:9px;font-size:11.5px;color:#b45309;background:#fffbeb;
 border:1px solid #fde68a;border-radius:7px;padding:6px 8px;line-height:1.55}
.warn b{color:#92400e}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;padding:7px 4px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;
 font-size:12px;color:#5a6169;cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.acts button:active{transform:scale(.97)}
.acts button.cur.ok{background:#ecfdf5;border-color:#6ee7b7;color:#047857;font-weight:600}
.acts button.cur.no{background:#fef2f2;border-color:#fca5a5;color:#b91c1c;font-weight:600}
.acts button.del{flex:0 0 58px;color:#9aa0a8}
.empty{text-align:center;color:#9aa0a8;padding:40px 0;font-size:13px}
.foot{margin-top:22px;font-size:11px;color:#a8adb5;text-align:center;line-height:1.7}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px}
</style>
</head>
<body>

    <input type="file" id="imp" accept=".json,application/json" style="display:none">

  <div class="foot" id="foot"></div>

QxzeHtXRx1Bs5P8KYPDPiH/oBat/4Byf8AxNc7UnuLndrEMb1aWYLyTQvhrxAB/wAgLVv/AADk/wAKrXeheJCNqaBrH1FlL/8AE1l7JyYXsRajrGP3cZ/Ksd52cksSSaunwp4lZsnQNYP/AG5S/wDxNO/4RPxH/wBC/rH/AIBS/wDxNdMKSgtDNybM8PSlwav/APCJ+I/+hf1f/wAApf8A4mpLfwZ4ouZBHD4c1h3PQCzk/wAKvlEYmmTSJbmwdVH2RyAwP392G/CvR/2b/h9ceJ/ixL4imhb+zNCImMhHyvcFAI0HqRksfTA9a0PAX7N3i7XtRmuNdh/sLTpHRi0pDTuAoBCoM4Pu2Poa+pvC3hbSvB2jQ6Ro9stvbRc+rSMersf4mPc1pSi07mive5//2Q==", "download": 18, "subscribe": 0, "star": "6", "comment_count": 0, "fastplay_hot": 17, "kind": "休闲", "event": "16:00试玩上线", "tags": ["休闲", "解压", "治愈"], "link": "https://a.4399.cn/game-id-428836.html", "boards": {"new": 116}, "status": "", "_delta": null, "_spark": ""}]};
const TITLES = {"hot": "热游", "subscribe": "预约", "new": "新游", "h5": "小游戏", "erci": "二次元", "all": "总榜"};
const ORDER = ["hot", "all", "erci", "subscribe", "h5"];
const LS_KEY = '4399watch_status_v2';

let ST = {};
try { ST = JSON.parse(localStorage.getItem(LS_KEY) || '{}') || {}; } catch(e){ ST = {}; }

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){} }
function statusOf(x){ return ST[x.gid] || x.status || ''; }
function setStatus(gid, s){
  if(statusOf({gid})===s) ST[gid]=''; else ST[gid]=s;
  if(!ST[gid]) delete ST[gid];
  save(); render();
}
function fmt(n){
  if(n>=100000000) return (n/100000000).toFixed(n>=1000000000?1:2).replace(/\.?0+$/,'')+'亿';
  if(n>=10000) return (n/10000).toFixed(n>=1000000?0:1).replace(/\.?0+$/,'')+'万';
  return String(n);
}
function deltaHtml(d){
  if(d===null||d===undefined) return '';
  if(d>0) return `<span class="up">↑${fmt(d)}</span>`;
  if(d<0) return `<span class="down">↓${fmt(-d)}</span>`;
  return '<span class="flat">持平</span>';
}
let filter='all';

function cardHtml(x){
  const st = statusOf(x);
  if(!x.matched){
    return `<div class="card off"><div class="top">
      <div class="icon ph">?</div>
      <div class="mid"><div class="gname">${x.name}</div>
        <span class="status off"><i class="dot"></i>未在榜单找到</span></div>
      </div>
      <div class="acts">
        <button class="${st==='granted'?'cur ok':''}" onclick="setStatus('${x.gid||x.name}','granted')">✓ 已获取授权</button>
        <button class="${st==='rejected'?'cur no':''}" onclick="setStatus('${x.gid||x.name}','rejected')">× 已拒绝</button>
        <button class="del" onclick="setStatus('${x.gid||x.name}','deleted')">删除</button>
      </div></div>`;
  }
  const onNew = x.boards && x.boards.new;
  const statusPill = onNew
    ? `<span class="status on"><i class="dot"></i>新游榜 #${onNew}</span>`
    : `<span class="status off"><i class="dot"></i>未上新游榜</span>`;
  const ic = x.icon ? `<img class="icon" src="${x.icon}" loading="lazy">` : `<div class="icon ph">·</div>`;
  const others = ORDER.filter(t=>x.boards&&x.boards[t])
    .map(t=>`<span class="bd">${TITLES[t]} #${x.boards[t]}</span>`).join('');
  const warn = (x.candidates&&x.candidates.length)
    ? `<div class="warn">⚠ 还命中 <b>${x.candidates.length}</b> 款相似游戏（${x.candidates.filter(c=>c.gid!==x.gid).slice(0,2).map(c=>c.game).join('、')||'—'}）</div>` : '';
  return `<div class="card ${st}${onNew?'':' off'}">
    <div class="top">
      ${ic}
      <div class="mid">
        <div class="gname"><a href="${x.link}" target="_blank">${x.game}</a></div>
        ${statusPill}
      </div>
      <div class="right">
        <div class="dl">${fmt(x.download)}<small>下载</small></div>
        <div class="dlz">${deltaHtml(x._delta)}</div>
      </div>
    </div>
    ${x._spark||''}
    ${others?`<div class="badges">${others}</div>`:''}
    ${warn}
    <div class="acts">
      <button class="${st==='granted'?'cur ok':''}" onclick="setStatus('${x.gid}','granted')">✓ 已获取授权</button>
      <button class="${st==='rejected'?'cur no':''}" onclick="setStatus('${x.gid}','rejected')">× 已拒绝</button>
      <button class="del" onclick="setStatus('${x.gid}','deleted')">删除</button>
    </div>
  </div>`;
}

function render(){
  const all = D.items.map(x=>({x, st: statusOf(x)}));
  const count = s => all.filter(o=>o.st===s).length;
  const todo = all.filter(o=>o.st!== 'granted' && o.st!=='rejected' && o.st!=='deleted').length;
  const granted = count('granted'), rejected = count('rejected'), deleted = count('deleted');

  document.getElementById('stats').innerHTML = `
    <div class="st todo"><div class="n">${todo}</div><div class="l">未处理</div></div>
    <div class="st granted"><div class="n">${granted}</div><div class="l">已授权</div></div>
    <div class="st rejected"><div class="n">${rejected}</div><div class="l">已拒绝</div></div>`;

  let list = all.filter(o=>{
    if(filter==='all') return o.st!=='deleted';
    if(filter==='todo') return o.st!=='granted'&&o.st!=='rejected'&&o.st!=='deleted';
    return o.st===filter;
  });
  list.sort((a,b)=>{
    const an=a.x.matched&&a.x.boards.new?a.x.boards.new:99999;
    const bn=b.x.matched&&b.x.boards.new?b.x.boards.new:99999;
    if(an!==bn) return an-bn;
    return (b.x.download||0)-(a.x.download||0);
  });

  const el=document.getElementById('list');
  if(!list.length){ el.innerHTML='<div class="empty">这一档没有游戏</div>'; }
  else el.innerHTML = list.map(o=>cardHtml(o.x)).join('');

  const bd=document.getElementById('bar');
  [['all','全部'],['todo','未处理'],['granted','已授权'],['rejected','已拒绝'],['deleted','已删除']].forEach(([k,label])=>{
    bd.querySelectorAll('button').forEach(b=>{ if(b.dataset.k===k) b.classList.toggle('on', filter===k); });
  });

  document.getElementById('sub').innerHTML =
   `更新 <b>${D.date}</b> · 关注 <b>${all.length}</b> 款`;
  document.getElementById('foot').innerHTML =
   `数字 = 4399 游戏盒下载量 · 新游榜会滚动换血<br>
    状态仅供你自己标记，存在本浏览器（换设备请用导出/导入）<br>
    抓取于 ${D.started_at}`;
}

// 筛选条
const bar=document.getElementById('bar');
[['all','全部'],['todo','未处理'],['granted','已授权'],['rejected','已拒绝'],['deleted','已删除']].forEach(([k,label])=>{
  const b=document.createElement('button');
  b.textContent=label; b.dataset.k=k; b.className=(k===filter?'on':'');
  b.onclick=()=>{ filter=k; render(); };
  bar.appendChild(b);
});

// 导出 / 导入
document.getElementById('exp').onclick=()=>{
  const payload={version:2, exportedAt:new Date().toISOString(), states:ST};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='4399关注状态_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
document.getElementById('impBtn').onclick=()=>document.getElementById('imp').click();
document.getElementById('imp').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const s=j.states||j;
      if(typeof s!=='object') throw new Error('格式不对');
      Object.assign(ST,s); save(); render();
      alert('已导入 '+Object.keys(s).length+' 条状态');
    }catch(err){ alert('导入失败：'+err.message); }
  };
  r.readAsText(f);
  e.target.value='';
};

render();
</script>
</body>
</html>
