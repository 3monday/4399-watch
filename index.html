const TITLES = {"hot": "热游", "subscribe": "预约", "new": "新游", "h5": "小游戏", "erci": "二次元", "all": "总榜"};
const ORDER = ["hot", "all", "erci", "subscribe", "h5"];
const TODAY = '2026-11-28';
const LS_KEY = '4399watch_status_v3';

// ST[gid] = {s:'granted'|'rejected'|'deleted', d:'YYYY-MM-DD', r:'拒绝理由'}
let ST = {};
try {
  const raw = JSON.parse(localStorage.getItem(LS_KEY) || localStorage.getItem('4399watch_status_v2') || '{}') || {};
  // 兼容 v2 的纯字符串格式
  for (const k in raw) {
    const v = raw[k];
    ST[k] = (typeof v === 'string') ? {s:v, d:'', r:''} : v;
  }
} catch(e){ ST = {}; }

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){} }
function stOf(x){ return ST[x.gid] || x._st || {s:'', d:'', r:''}; }
function stKey(x){ return x.gid || x.name; }

function setStatus(key, s){
  const cur = ST[key] || {};
  if (cur.s === s) { delete ST[key]; }        // 再点一次 = 取消
  else { ST[key] = {s: s, d: TODAY, r: s==='rejected' ? (cur.r||'') : ''}; }
  save(); render();
}
// 改日期/理由：只存不重绘，避免输入时丢焦点
function setDate(key, val){
  if(!ST[key]) return;
  ST[key].d = val; save();
}
function setReason(key, val){
  if(!ST[key]) return;
  ST[key].r = val; save();
}

function fmt(n){
  if(n>=100000000) return (n/100000000).toFixed(n>=1000000000?1:2).replace(/\.?0+$/,'')+'亿';
  if(n>=10000) return (n/10000).toFixed(n>=1000000?0:1).replace(/\.?0+$/,'')+'万';
  return String(n);
}
function deltaHtml(d){
  if(d===null||d===undefined) return '';
  if(d>0) return `<span class="up">↑${fmt(d)}</span>`;
  if(d<0) return `<span class="down">↓${fmt(-d)}</span>`;
  return '<span class="flat">持平</span>';
}
function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function upRow(x){
  const bits = [];
  if (x.up) bits.push(`UP主 <b>${esc(x.up)}</b>`);
  if (x.blocked) bits.push(esc(x.blocked));
  if (x.extra) bits.push(esc(x.extra));
  if (!bits.length) return '';
  return `<div class="uprow">${bits.join('　·　')}</div>`;
}

function detailHtml(x, st){
  if (!st || !st.s || st.s === 'deleted') return '';
  const key = stKey(x);
  const label = st.s === 'granted' ? '授权日期' : '拒绝日期';
  const reasonRow = st.s === 'rejected'
    ? `<div class="row"><label>拒绝理由</label>
         <input type="text" value="${esc(st.r)}" placeholder="填一下为什么拒绝"
          data-act="reason" data-k="${esc(key)}"></div>`
    : '';
  return `<div class="detail">
      <div class="row"><label>${label}</label>
        <input type="date" value="${esc(st.d)}" data-act="date" data-k="${esc(key)}">
        <span class="stamp">可手改</span>
      </div>
      ${reasonRow}
    </div>`;
}

function cardHtml(x){
  const st = stOf(x);
  const key = stKey(x);
  const sk = esc(key);
  if(!x.matched){
    const pill = x.pending
      ? `<span class="status off"><i class="dot"></i>4399 暂查不到</span>`
      : `<span class="status off"><i class="dot"></i>未在榜单找到</span>`;
    const hint = x.pending
      ? `<div class="warn">已挂上（gid ${esc(x.gid)}），4399 搜索和榜单都还查不到，进去后会自动显示</div>` : '';
    return `<div class="card off ${st.s||''}"><div class="top">
      <div class="icon ph">?</div>
      <div class="mid"><div class="gname">${esc(x.name)}</div>
        ${upRow(x)}
        ${pill}</div>
      </div>
      ${hint}
      <div class="acts">
        <button class="${st.s==='granted'?'cur ok':''}" data-act="set" data-k="${sk}" data-s="granted">✓ 已获取授权</button>
        <button class="${st.s==='rejected'?'cur no':''}" data-act="set" data-k="${sk}" data-s="rejected">× 已拒绝</button>
        <button class="del" data-act="set" data-k="${sk}" data-s="deleted">删除</button>
      </div>
      ${detailHtml(x, st)}
    </div>`;
  }
  const onNew = x.boards && x.boards.new;
  const statusPill = onNew
    ? `<span class="status on"><i class="dot"></i>新游榜 #${onNew}</span>`
    : `<span class="status off"><i class="dot"></i>未上新游榜</span>`;
  const ic = x.icon ? `<img class="icon" src="${x.icon}" loading="lazy">` : `<div class="icon ph">·</div>`;
  const others = ORDER.filter(t=>x.boards&&x.boards[t])
    .map(t=>`<span class="bd">${TITLES[t]} #${x.boards[t]}</span>`).join('');
  const warn = (x.candidates&&x.candidates.length)
    ? `<div class="warn">⚠ 还命中 <b>${x.candidates.length}</b> 款相似游戏（${x.candidates.filter(c=>c.gid!==x.gid).slice(0,2).map(c=>esc(c.game)).join('、')||'—'}）</div>` : '';
  return `<div class="card ${st.s||''}${onNew?'':' off'}">
    <div class="top">
      ${ic}
      <div class="mid">
        <div class="gname"><a href="${x.link}" target="_blank">${esc(x.game)}</a></div>
        ${upRow(x)}
        ${statusPill}
      </div>
      <div class="right">
        <div class="dl">${fmt(x.download)}<small>下载</small></div>
        <div class="dlz">${deltaHtml(x._delta)}</div>
      </div>
    </div>
    ${x._spark||''}
    ${others?`<div class="badges">${others}</div>`:''}
    ${warn}
    <div class="acts">
      <button class="${st.s==='granted'?'cur ok':''}" data-act="set" data-k="${sk}" data-s="granted">✓ 已获取授权</button>
      <button class="${st.s==='rejected'?'cur no':''}" data-act="set" data-k="${sk}" data-s="rejected">× 已拒绝</button>
      <button class="del" data-act="set" data-k="${sk}" data-s="deleted">删除</button>
    </div>
    ${detailHtml(x, st)}
  </div>`;
}

let filter='all';
let sortMode='newrank';   // newrank | download | delta | name
let q='';

function render(){
  const all = D.items.map(x=>({x, st: stOf(x)}));
  const cnt = s => all.filter(o=>o.st.s===s).length;
  const todo = all.filter(o=>!['granted','rejected','deleted'].includes(o.st.s)).length;

  document.getElementById('stats').innerHTML = `
    <div class="st todo"><div class="n">${todo}</div><div class="l">未处理</div></div>
    <div class="st granted"><div class="n">${cnt('granted')}</div><div class="l">已授权</div></div>
    <div class="st rejected"><div class="n">${cnt('rejected')}</div><div class="l">已拒绝</div></div>`;

  let list = all.filter(o=>{
    if(filter==='all') return o.st.s!=='deleted';
    if(filter==='todo') return !['granted','rejected','deleted'].includes(o.st.s);
    return o.st.s===filter;
  });
  // 关键词过滤
  if(q){
    const k=q.toLowerCase();
    list = list.filter(o=>{
      const x=o.x;
      const hay=[x.game||'', x.name||'', x.up||'', x.blocked||'', x.extra||'', x.note||'']
        .join(' ').toLowerCase();
      return hay.includes(k);
    });
  }

  // 排序
  const newRank = x => (x.matched && x.boards && x.boards.new) ? x.boards.new : 99999;
  if(sortMode==='download'){
    list.sort((a,b)=>(b.x.download||0)-(a.x.download||0));
  } else if(sortMode==='delta'){
    list.sort((a,b)=>(b.x._delta||0)-(a.x._delta||0));
  } else if(sortMode==='name'){
    list.sort((a,b)=>(a.x.game||a.x.name||'').localeCompare(b.x.game||b.x.name||'','zh'));
  } else {
    list.sort((a,b)=>{
      const an=newRank(a.x), bn=newRank(b.x);
      if(an!==bn) return an-bn;
      return (b.x.download||0)-(a.x.download||0);
    });
  }

  const el=document.getElementById('list');
  el.innerHTML = list.length
    ? list.map(o=>cardHtml(o.x)).join('')
    : `<div class="empty">${q ? '没有匹配「'+esc(q)+'」的游戏' : '这一档没有游戏'}</div>`;

  document.getElementById('bar').querySelectorAll('button')
    .forEach(b=>b.classList.toggle('on', b.dataset.k===filter));
  document.getElementById('sorter').querySelectorAll('button')
    .forEach(b=>b.classList.toggle('on', b.dataset.s===sortMode));

  document.getElementById('sub').innerHTML =
   `更新 <b>${D.date}</b> · 关注 <b>${all.length}</b> 款` +
   (q ? ` · 命中 <b>${list.length}</b> 款` : '');
  document.getElementById('foot').innerHTML =
   `数字 = 4399 游戏盒下载量 · 新游榜会滚动换血<br>
    授权/拒绝状态与日期存在本浏览器（换设备请用导出/导入）<br>
    抓取于 ${D.started_at}`;
}

// 事件委托：按钮点击 / 日期与理由输入
document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act="set"]');
  if(!b) return;
  setStatus(b.dataset.k, b.dataset.s);
});
document.getElementById('list').addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.act==='date') setDate(t.dataset.k, t.value);
  if(t.dataset.act==='reason') setReason(t.dataset.k, t.value);
});
document.getElementById('list').addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.act==='reason') setReason(t.dataset.k, t.value);
});

// 排序按钮
const sorter=document.getElementById('sorter');
const SORT_LABEL={newrank:'按新游榜位', download:'按下载量', delta:'按日增量', name:'按名称'};
[['download','↓ 下载量'],['delta','日增量'],['newrank','新游榜位'],['name','名称']].forEach(([k,label])=>{
  const b=document.createElement('button');
  b.textContent=label; b.dataset.s=k; b.className=(k===sortMode?'on':'');
  b.onclick=()=>{ sortMode=k; render(); };
  sorter.appendChild(b);
});

// 搜索框
const qEl=document.getElementById('q');
const qBox=document.querySelector('.searchbox');
let qTimer=null;
qEl.addEventListener('input', ()=>{
  qBox.classList.toggle('has', !!qEl.value);
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ q=qEl.value.trim(); render(); }, 160);
});
document.getElementById('qc').onclick=()=>{
  qEl.value=''; qBox.classList.remove('has'); q=''; render();
};

// 筛选条
const bar=document.getElementById('bar');
[['all','全部'],['todo','未处理'],['granted','已授权'],['rejected','已拒绝'],['deleted','已删除']].forEach(([k,label])=>{
  const b=document.createElement('button');
  b.textContent=label; b.dataset.k=k; b.className=(k===filter?'on':'');
  b.onclick=()=>{ filter=k; render(); };
  bar.appendChild(b);
});

// 导出 / 导入
document.getElementById('exp').onclick=()=>{
  const payload={version:3, exportedAt:new Date().toISOString(), states:ST};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='4399关注状态_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
document.getElementById('impBtn').onclick=()=>document.getElementById('imp').click();
document.getElementById('imp').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const s=j.states||j;
      if(typeof s!=='object') throw new Error('格式不对');
      for(const k in s){
        const v=s[k];
        ST[k] = (typeof v==='string') ? {s:v,d:'',r:''} : v;
      }
      save(); render();
      alert('已导入 '+Object.keys(s).length+' 条状态');
    }catch(err){ alert('导入失败：'+err.message); }
  };
  r.readAsText(f);
  e.target.value='';
};

render();
</script>
</body>
</html>
